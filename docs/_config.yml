# GitHub Pages (Jekyll) configuration
# Repo → Settings → Pages → Source: Deploy from branch → main → /docs

title: Finance Wizard
description: Personal iOS finance tracker — app, widget, and finance-sync integration
# Must match the GitHub repository name (this repo is Finance-Wizard)
baseurl: "/Finance-Wizard"
url: ""

# Use the built-in Primer-like minimal theme via remote theme
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
highlighter: rouge

# Shown in theme header
show_downloads: false
