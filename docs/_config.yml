# GitHub Pages (Jekyll) configuration
# Repo → Settings → Pages → Source: Deploy from branch → main → /docs

title: Budget Magi
description: Personal iOS finance tracker — Plaid Link, SwiftData, and Home Screen widgets
# Must match the GitHub repository name (this repo is Budget-Magi)
baseurl: "/Budget-Magi"
url: ""

# Use the built-in Primer-like minimal theme via remote theme
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
highlighter: rouge

# Shown in theme header
show_downloads: false
