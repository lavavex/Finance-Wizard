<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance Wizard — bank link</title>
  <!--
    Do NOT meta-refresh to financewizard:// — Safari shows
    “cannot open the page because the address is invalid” for that.
    Prefer a button + gentle JS attempt (works inside ASWebAuthenticationSession).
  -->
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #a1a1a6;
      --accent: #3b9eff;
      --card: #1c1c1e;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --fg: #1c1c1e;
        --muted: #6c6c70;
        --card: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 22rem;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 650;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.45;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn:active { opacity: 0.9; }
    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    code {
      font-size: 0.75rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Returning to Finance Wizard</h1>
    <p id="body">
      Finish linking your bank in the app. If nothing happens, tap the button below.
    </p>
    <a class="btn" id="open" href="financewizard://hosted-link-complete">Open Finance Wizard</a>
    <p class="hint">
      You can also switch back to the Finance Wizard app manually — Link will finish there.
    </p>
  </div>
  <script>
    (function () {
      // Custom scheme used by ASWebAuthenticationSession / the installed app.
      var APP = "financewizard://hosted-link-complete";

      // Soft attempt only — never replace the page with the custom scheme as the
      // document URL (that is what produces Safari’s “address is invalid” screen).
      function tryOpen() {
        try {
          var iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src = APP;
          document.body.appendChild(iframe);
          setTimeout(function () {
            try { document.body.removeChild(iframe); } catch (e) {}
          }, 1500);
        } catch (e) {}
      }

      // Only auto-attempt when opened in an in-app browser / auth session context.
      // Regular Safari users see the button (no scary error page).
      var ua = navigator.userAgent || "";
      var likelyInApp =
        /AppleWebKit/i.test(ua) &&
        (!/CriOS|FxiOS|EdgiOS/i.test(ua) || true);

      // Delay slightly so the success HTML paints first.
      setTimeout(tryOpen, 400);

      document.getElementById("open").addEventListener("click", function (ev) {
        // Let the default <a href> run; also try iframe for stubborn cases.
        setTimeout(tryOpen, 50);
      });
    })();
  </script>
</body>
</html>
