# Plaid webhook receiver — free Cloudflare Workers tier.
# Deploy when ready (ask before first deploy):
#   cd workers/plaid-webhooks && npx wrangler deploy
#
# Then set in Plaid Dashboard → Webhooks:
#   https://plaid-webhooks.<your-subdomain>.workers.dev/plaid/webhook
#
# Optional KV (persist last event per item for /pending poll):
#   npx wrangler kv namespace create WEBHOOKS
#   # paste id below and uncomment

name = "plaid-webhooks"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# [[kv_namespaces]]
# binding = "WEBHOOKS"
# id = "YOUR_KV_NAMESPACE_ID"

# Optional: wrangler secret put WEBHOOK_INGEST_KEY
# Protects GET /pending only (Plaid POSTs have no custom header).
